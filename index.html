<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дашульці 💌</title>
<style>
:root{--bg:#1a0f16;--rose:#f3c6d3;--ink:#4a2433;--paper:#fff7f2}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:radial-gradient(ellipse at 50% 30%,#3a1a2a,var(--bg) 70%);color:var(--rose);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation}
.st{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s}
.st.on{opacity:1;pointer-events:auto}
h1{font-weight:400;font-style:italic;font-size:clamp(2rem,9vw,3.4rem);text-align:center;line-height:1.2;opacity:0;animation:in 1.6s .3s forwards}
@keyframes in{to{opacity:1}}
.env{position:relative;width:min(80vw,320px);height:min(54vw,214px);margin-top:9vh;opacity:0;transform:translateY(60px);animation:rise 1.4s 1.6s forwards;perspective:900px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
@keyframes rise{to{opacity:1;transform:none}}
.env>div{position:absolute}
.back{inset:0;background:#c9708a;border-radius:8px}
.ltr{left:6%;right:6%;top:6%;bottom:6%;background:repeating-linear-gradient(#fff7f2 0 17px,#f1dcd8 17px 18px);border-radius:3px;transition:transform 1.1s .7s;z-index:1}
.pl,.pr,.pb{inset:0;z-index:2}
.pl{background:#e8a0b5;clip-path:polygon(0 0,52% 56%,0 100%)}
.pr{background:#e596ac;clip-path:polygon(100% 0,48% 56%,100% 100%)}
.pb{background:#f0b3c5;clip-path:polygon(0 100%,50% 50%,100% 100%)}
.flap{left:0;right:0;top:0;height:58%;background:#df89a3;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s,background .9s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0;background:#b9607b}
.env.open .ltr{transform:translateY(-52%)}
.seal{left:50%;top:58%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fa8,#c2284f);display:flex;align-items:center;justify-content:center;color:#ffe3ea;font-size:1.2rem;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:opacity .4s}
.env.open .seal{opacity:0}
#zb{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:12;display:none;flex-direction:column;gap:10px}
#zb.on{display:flex}
#zb button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,200,215,.5);background:rgba(40,15,28,.6);color:var(--rose);font-size:1.5rem}
#letter{position:fixed;inset:0;display:none;padding:7vh 6vw 16vh;overflow-y:auto;background:var(--paper);color:var(--ink);opacity:0;transition:opacity 1.2s;z-index:5}
#letter.on{display:block;opacity:1}
#letter .in{max-width:520px;margin:0 auto}
#letter p{font-size:clamp(1.15rem,4.6vw,1.5rem);line-height:1.6;margin-bottom:1.1em;opacity:0;transform:translateY(8px);transition:all 1.1s}
#letter p.v{opacity:1;transform:none}
#letter .hd{font-style:italic;font-size:1.8rem;color:#b5566f}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:.5em 1em;font-size:1rem;opacity:0;transition:opacity 1.5s}
.langs.v{opacity:1}
.langs span{color:#b5566f;line-height:1.35}
.langs small{display:block;color:#a58a93;font-size:.7rem}
#btn{position:fixed;left:50%;bottom:calc(5vh + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:20;opacity:0;pointer-events:none;border:0;border-radius:40px;padding:.9em 2.4em;font:italic 1.3rem Georgia,serif;color:#fff;background:linear-gradient(135deg,#e8708f,#b5566f);box-shadow:0 0 0 0 rgba(232,112,143,.6);animation:pulse 2s infinite;transition:opacity .8s,transform .8s}
#btn.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(232,112,143,0)}}
.h{position:fixed;bottom:-40px;z-index:15;pointer-events:none;animation:fly linear forwards}
@keyframes fly{to{transform:translate(var(--dx),-115vh) rotate(var(--r))}}
#gal{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity 2s;touch-action:none;cursor:grab}
#gal.on{opacity:1}
#cap{position:fixed;top:calc(6vh + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:italic clamp(1.4rem,6vw,2rem) Georgia,serif;z-index:10;opacity:0;transition:opacity 1.2s;padding:0 5vw}
#cap.on{opacity:1}
@media(prefers-reduced-motion:reduce){#btn{animation:none}}
</style></head><body>

<div class="st on" id="s0"><h1>Дашулька,<br>тобі лист 💌</h1>

<div id="letter"><div class="in" id="lin"></div></div>

const $=id=>document.getElementById(id),btn=$('btn'),cap=$('cap');
let step=0;
function setBtn(t,f){btn.textContent=t;btn.onclick=()=>{btn.classList.remove('on');f()};btn.classList.add('on')}
setTimeout(()=>setBtn('Натискай 💌',openEnv),3400);

function openEnv(){
 $('env').classList.add('open');
 setTimeout(()=>{$('s0').classList.remove('on');showLetter()},2600);
}
function showLetter(){
 const L=$('lin');
 LETTER.forEach(([c,t])=>{const p=document.createElement('p');if(c=='hd')p.className='hd';p.textContent=t;L.appendChild(p)});
 const g=document.createElement('div');g.className='langs';
 LANGS.forEach(([a,b])=>{const s=document.createElement('span');s.innerHTML=b+'<small>'+a+'</small>';g.appendChild(s)});
 L.appendChild(g);
 $('letter').classList.add('on');
 const ps=[...L.querySelectorAll('p')];
 ps.forEach((p,i)=>setTimeout(()=>p.classList.add('v'),900+i*1700));
 setTimeout(()=>g.classList.add('v'),900+ps.length*1700);
 setTimeout(()=>setBtn('Натисни ❤',hearts),900+ps.length*1700+3500);
}
function hearts(){
 const E=['🤍','💙','🩵','🤍','💙','✨','🤍','🩵'];
 for(let i=0;i<70;i++){
  const h=document.createElement('div');h.className='h';h.textContent=E[i%E.length];
  h.style.left=Math.random()*100+'vw';h.style.fontSize=(18+Math.random()*34)+'px';
  h.style.setProperty('--dx',(Math.random()*160-80)+'px');h.style.setProperty('--r',(Math.random()*80-40)+'deg');
  h.style.animationDuration=(3+Math.random()*3)+'s';h.style.animationDelay=(Math.random()*1.5)+'s';
  document.body.appendChild(h);setTimeout(()=>h.remove(),7000);
 }
 setTimeout(()=>{$('letter').style.opacity=0;setTimeout(()=>{$('letter').classList.remove('on');galaxy()},1300)},2800);
}

// ====== ГАЛАКТИКА ======
const cv=$('gal'),cx=cv.getContext('2d');let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',()=>{size();layout()});size();
const COLS=50,ROWS=89,N=COLS*ROWS,TOK=['люблю','love','amo','♥','я ♥','te amo','liebe','🤍'.length?'t\'aime':''];
let zm=1,zt=1,pd=1,P=[],rot=0,tilt=1.0,vr=.004,drag=false,lx=0,ly=0,morph=0,morphOn=false,cells=[];
for(let i=0;i<N;i++){
 const arm=i%3,r=Math.pow(Math.random(),.6),a=arm*2.094+r*5.2+(Math.random()-.5)*.55*(1.1-r*.6);
 P.push({r,a,y:(Math.random()-.5)*.08*(1.2-r),w:TOK[(Math.random()*TOK.length)|0]||'❤',d:Math.random()*.45,tx:0,ty:0,c:[255,200,215],gc:[255,170+Math.random()*60|0,200+Math.random()*40|0],fx:0,fy:0});
}
const im=new Image();im.onload=()=>{
 const o=document.createElement('canvas');o.width=COLS;o.height=ROWS;const c=o.getContext('2d');c.drawImage(im,0,0,COLS,ROWS);
 const d=c.getImageData(0,0,COLS,ROWS).data;
 for(let i=0;i<N;i++)cells.push([i%COLS,(i/COLS)|0,d[i*4],d[i*4+1],d[i*4+2]]);
 cells.sort(()=>Math.random()-.5);
 P.forEach((p,i)=>{p.cell=cells[i]});layout();
};im.src=PHOTO;
let cs=8,ox=0,oy=0;
function layout(){cs=Math.min(W*.96/COLS,H*.86/ROWS);ox=(W-COLS*cs)/2;oy=(H-ROWS*cs)/2+H*.02;
 P.forEach(p=>{if(p.cell){p.tx=ox+(p.cell[0]+.5)*cs;p.ty=oy+(p.cell[1]+.5)*cs;p.pc=[p.cell[2],p.cell[3],p.cell[4]]}})}
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
let t0=0;
function frame(ts){
 requestAnimationFrame(frame);
 if(!cv.classList.contains('on'))return;
 if(!drag)rot+=morphOn?vr*Math.max(0,1-morph):vr;
 if(morphOn&&morph<1.6)morph+=.0045;
 cx.clearRect(0,0,W,H);cx.textAlign='center';cx.textBaseline='middle';
 const R=Math.min(W*.48,H*.3),cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(tilt),st=Math.sin(tilt),cyc=H*.5;
 zm+=(zt-zm)*.15;const fs0=Math.max(7,R/28)*zm,pa=morphOn&&im.complete?Math.max(0,Math.min(1,(morph-1)/.6)):0;if(pa>0){cx.globalAlpha=pa;cx.drawImage(im,ox,oy,COLS*cs,ROWS*cs);cx.globalAlpha=1}
 for(let i=0;i<N;i++){
  const p=P[i],ang=p.a+rot*0,x0=Math.cos(p.a)*p.r,z0=Math.sin(p.a)*p.r;
  const x1=x0*cr-z0*sr,z1=x0*sr+z0*cr,y1=p.y*ct-z1*st,zz=p.y*st+z1*ct;
  let X=W/2+x1*R*1.9*zm,Y=cyc+y1*R*1.9*zm,fs=fs0*(1-p.r*.35),a=.35+.65*(1-p.r*.7),rgb=p.gc;
  if(morphOn&&p.pc){const k=ease((morph-p.d)/.9);
   X+=(p.tx-X)*k;Y+=(p.ty-Y)*k;fs+=(cs*.95-fs)*k;a+=(1-a)*k;
   rgb=[p.gc[0]+(p.pc[0]-p.gc[0])*k|0,p.gc[1]+(p.pc[1]-p.gc[1])*k|0,p.gc[2]+(p.pc[2]-p.gc[2])*k|0]}
  if(pa>.995||X<-60||X>W+60||Y<-30||Y>H+30)continue;cx.font=(fs|0)+'px Georgia,serif';
  cx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a*(1-pa)+')';
  cx.fillText(p.w,X,Y);
 }
 // світле ядро
 if(!morphOn||morph<.6){const g=cx.createRadialGradient(W/2,cyc,0,W/2,cyc,R*.35*zm);g.addColorStop(0,'rgba(255,235,240,'+.9*(1-morph)+')');g.addColorStop(1,'rgba(255,200,215,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}
}
requestAnimationFrame(frame);
function pt(e){return e.touches?e.touches[0]:e}
